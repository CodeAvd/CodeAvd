<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" fill="none" role="img" aria-label="Grigorii — AI and Quant Engineer, Agent Builder, Full-Stack Tinkerer">
  <defs>
    <!-- moving brand gradient for the wordmark (animated stop offsets = shimmer sweep) -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6">
        <animate attributeName="offset" values="-1;1" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#22D3EE">
        <animate attributeName="offset" values="-0.5;1.5" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8B5CF6">
        <animate attributeName="offset" values="0;2" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glowV" cx="22%" cy="18%" r="60%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="84%" cy="92%" r="62%">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8B5CF6" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- panel -->
  <rect x="2" y="2" width="1196" height="296" rx="26" fill="#0D1117"/>
  <rect x="2" y="2" width="1196" height="296" rx="26" fill="url(#grid)"/>
  <rect x="2" y="2" width="1196" height="296" rx="26" fill="url(#glowV)"/>
  <rect x="2" y="2" width="1196" height="296" rx="26" fill="url(#glowC)"/>
  <rect x="2.75" y="2.75" width="1194.5" height="294.5" rx="25.25" fill="none" stroke="url(#edge)" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- breathing aura behind the wordmark -->
  <ellipse cx="600" cy="132" rx="330" ry="64" fill="#8B5CF6" opacity="0.10">
    <animate attributeName="opacity" values="0.06;0.16;0.06" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="300;360;300" dur="4.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- prompt mark -->
  <text x="600" y="150" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="30" fill="#06B6D4" opacity="0.85">
    <tspan dx="-244">&#187;</tspan>
  </text>

  <!-- wordmark -->
  <text x="600" y="150" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="86" font-weight="800" letter-spacing="2" fill="url(#shine)">Grigorii</text>

  <!-- handle -->
  <text x="600" y="196" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="23" font-weight="600" fill="#7C8AA5" letter-spacing="3">@CodeAvd</text>

  <!-- tagline -->
  <text x="600" y="236" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="500" fill="#C9D1D9" letter-spacing="0.4">AI &amp; Quant Engineer &#160;&#183;&#160; Agent Builder &#160;&#183;&#160; Full-Stack Tinkerer</text>

  <!-- animated underline accent -->
  <rect x="510" y="255" width="180" height="3" rx="1.5" fill="url(#edge)">
    <animate attributeName="width" values="60;180;60" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="570;510;570" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal cursor dots -->
  <g>
    <circle cx="582" cy="278" r="4" fill="#8B5CF6"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="278" r="4" fill="#3AB6E0"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.4s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="618" cy="278" r="4" fill="#06B6D4"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.4s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
